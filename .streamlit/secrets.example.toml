# Copie este arquivo para secrets.toml e substitua os valores de exemplo.
# Nunca versione o arquivo secrets.toml.

GSHEETS_ID = "SUBSTITUA_PELO_ID_DA_PLANILHA"
SHEET_ID_ATIVOS = "SUBSTITUA_PELO_ID_DA_PLANILHA_DE_ATIVOS"
SHEET_ID_PROD = "SUBSTITUA_PELO_ID_DA_PLANILHA_DE_PRODUCAO"
DRIVE_ID_CONS = "SUBSTITUA_PELO_ID_DA_PASTA_DO_DRIVE"
URL_ATIVOS = "https://docs.google.com/spreadsheets/d/SUBSTITUA_PELO_ID"

# Credenciais de acesso da tela de Gestão de Ativos.
# Defina usuários e senhas fortes para o seu ambiente.
[usuarios.admin]
nome = "Administrador"
senha = ""
role = "admin"
bases = []

# Credencial da Service Account usada pelas integrações com Google Sheets.
# Copie estes campos do JSON da Service Account do Google Cloud.
[gcp_service_account]
type = "service_account"
project_id = "SUBSTITUA_PELO_PROJECT_ID"
private_key_id = "SUBSTITUA_PELO_PRIVATE_KEY_ID"
private_key = "-----BEGIN PRIVATE KEY-----\nSUBSTITUA_PELA_CHAVE_PRIVADA\n-----END PRIVATE KEY-----\n"
client_email = "SUBSTITUA_PELO_EMAIL_DA_SERVICE_ACCOUNT"
client_id = "SUBSTITUA_PELO_CLIENT_ID"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "SUBSTITUA_PELO_CERTIFICATE_URL"
universe_domain = "googleapis.com"
